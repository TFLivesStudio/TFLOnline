name: Build & Test

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build and test
        run: gradle clean build --stacktrace
      - name: Upload JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tflonline-snapshot
          path: |
            velocity/build/libs/TFLOnline-Velocity-*.jar
            bungee/build/libs/TFLOnline-Bungee-*.jar
            paper/build/libs/TFLOnline-Paper-*.jar
          if-no-files-found: error
